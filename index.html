<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos y Gastos Hormiga</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Control de Gastos</h2>
        <form id="gastoForm">
            <div class="form-group">
                <label for="tipo">Tipo de Movimiento:</label>
                <select id="tipo">
                    <option value="Egreso">Egreso (Gasto)</option>
                    <option value="Ingreso">Ingreso</option>
                </select>
            </div>

            <div class="form-group">
                <label for="categoria">Categoría:</label>
                <select id="categoria">
                    <option value="Hormiga">Gastos Hormiga (Café, snacks, etc.)</option>
                    <option value="Comida">Comida / Supermercado</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Entretenimiento">Entretenimiento</option>
                    <option value="Salario">Salario / Ingresos</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="monto">Monto:</label>
                <input type="number" id="monto" step="0.01" placeholder="Ej. 5.50" required>
            </div>

            <div class="form-group">
                <label for="fuente">Fuente de Fondos:</label>
                <select id="fuente">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta de crédito">Tarjeta de crédito</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Otra">Otra</option>
                </select>
            </div>

            <button type="submit" id="btnEnviar">Guardar y Sincronizar</button>
            <div id="mensaje"></div>
        </form>
    </div>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT ENTRE LAS COMILLAS
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyeqA7ZN8GLFh3BP-sda22EhIwet5FQoq59mcL_rsD6feuC9L0gDYpSI-iYqEuBoplP/exec";

        const form = document.getElementById('gastoForm');
        const mensaje = document.getElementById('mensaje');
        const btnEnviar = document.getElementById('btnEnviar');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            btnEnviar.disabled = true;
            btnEnviar.textContent = "Guardando...";
            mensaje.style.color = "blue";
            mensaje.textContent = "Sincronizando con la nube...";

            const datos = {
                fecha: new Date().toISOString(),
                tipo: document.getElementById('tipo').value,
                categoria: document.getElementById('categoria').value,
                monto: parseFloat(document.getElementById('monto').value),
                fuente: document.getElementById('fuente').value
            };

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Necesario para evitar bloqueos de CORS con Google Apps Script
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });

                mensaje.style.color = "green";
                mensaje.textContent = "¡Registrado con éxito!";
                form.reset();
            } catch (error) {
                console.error("Error:", error);
                mensaje.style.color = "red";
                mensaje.textContent = "Hubo un error al guardar.";
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.textContent = "Guardar y Sincronizar";
                setTimeout(() => { mensaje.textContent = ""; }, 4000);
            }
        });
    </script>
</body>
</html>
